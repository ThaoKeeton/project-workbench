<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>合成电子样品</title>
  <script>document.title = "合成电子样品";</script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f4f1ea; color: #1c1915; }
    header { display: flex; gap: 12px; align-items: center; padding: 16px; }
    button { font-size: 16px; padding: 8px 14px; }
    #status { min-width: 120px; }
    .ant-modal { position: fixed; inset: 80px 180px; background: white; border: 1px solid #d9d9d9; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    canvas { display: block; margin: 8px 16px; background: #111; }
  </style>
</head>
<body>
  <header>
    <button id="start" type="button">开始</button>
    <button id="popup" type="button">弹出</button>
    <div id="status" role="status"></div>
  </header>
  <div class="ant-modal" hidden>
    <div class="ant-modal-content">合成弹窗：请先完成加载</div>
  </div>
  <canvas id="view" width="640" height="360"></canvas>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
