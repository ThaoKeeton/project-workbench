name: Build and native verification
on:
  pull_request:
  push:
    branches: [main, feat/native-plugin-workbench]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Smoke report filesystem regressions
        shell: pwsh
        run: |
          ./tests/scripts/NativeSmokeReport.Tests.ps1
          ./tests/scripts/WorkspaceProbeReport.Tests.ps1
          ./tests/scripts/WorkspaceProbePhase.Tests.ps1
          ./tests/scripts/TestingPluginProbe.Tests.ps1
          ./tests/scripts/TestingPluginPackage.Tests.ps1 -HelperGuardsOnly
          ./tests/scripts/NativeGalleryReport.Tests.ps1
          ./tests/scripts/OwnedLabBuild.Tests.ps1 -Mode ToolchainContract
          ./tests/scripts/OwnedLabProbeStaging.Tests.ps1
          ./tests/scripts/OwnedLabProbeOutput.Tests.ps1
      - name: Debug launch privacy and argument regressions
        shell: pwsh
        run: ./tests/scripts/NativeDebugSupport.Tests.ps1
      - name: Pinned business package import and process report regressions
        shell: pwsh
        run: |
          ./tests/scripts/BusinessPluginImport.Tests.ps1
          ./tests/scripts/BusinessPluginReport.Tests.ps1
      - name: Core runtime and real filesystem tests
        run: dotnet test ProjectWorkbench.Core.slnx -c Release --nologo --logger "trx;LogFileName=core-linux.trx" --results-directory artifacts/tests
      - name: Explicit owned reference compilation and missing helper refusals
        shell: pwsh
        run: |
          dotnet build tests/Workbench.OwnedLab.WindowsProbe -c Release --nologo -p:OwnedLabReferenceOnly=true -p:UseWinUI=false -p:AppxGeneratePriEnabled=false -p:WindowsAppSDKSelfContained=false
          if ($LASTEXITCODE -ne 0) { throw 'Owned reference probe compilation failed.' }
          dotnet tests/Workbench.OwnedLab.WindowsProbe/bin/Release/net10.0-windows10.0.19041.0/Workbench.OwnedLab.WindowsProbe.dll --reference-only-check
          if ($LASTEXITCODE -ne 0) { throw 'Owned reference descriptor/queue refusal failed.' }
          dotnet tests/Workbench.OwnedLab.WindowsProbe/bin/Release/net10.0-windows10.0.19041.0/Workbench.OwnedLab.WindowsProbe.dll --scenario-policy-check
          if ($LASTEXITCODE -ne 0) { throw 'Owned scenario retirement policy checks failed.' }
          ./tests/scripts/OwnedLabProbeStaging.Tests.ps1 -ProbeDirectory ./tests/Workbench.OwnedLab.WindowsProbe/bin/Release/net10.0-windows10.0.19041.0
          ./scripts/package-testing-plugin.ps1 -ReferenceOnly -OutputDirectory ./artifacts/reference-must-not-create-delivery
          if (Test-Path ./artifacts/reference-must-not-create-delivery) { throw 'Reference compilation produced a production delivery.' }
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build plugins/Workbench.Testing.Windows -c Release --nologo --no-restore -t:Rebuild -p:OwnedLabReferenceOnly=false *> ./artifacts/tests/owned-missing-helper.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -LiteralPath ./artifacts/tests/owned-missing-helper.log -Pattern 'UnavailableHelper:' -Quiet)) { throw 'Missing production helper was accepted or failed for an unrelated reason.' }
          $global:LASTEXITCODE = 0
          Write-Host 'Reference-only unavailable descriptor and missing production helper refusals passed; no native execution or ZIP.'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: core-linux-results
          path: artifacts/tests
          if-no-files-found: error
          retention-days: 1
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Smoke report filesystem regressions
        shell: pwsh
        run: |
          ./tests/scripts/NativeSmokeReport.Tests.ps1
          ./tests/scripts/WorkspaceProbeReport.Tests.ps1
          ./tests/scripts/WorkspaceProbePhase.Tests.ps1
          ./tests/scripts/TestingPluginProbe.Tests.ps1
          ./tests/scripts/TestingPluginPackage.Tests.ps1 -HelperGuardsOnly
          ./tests/scripts/NativeGalleryReport.Tests.ps1
          ./tests/scripts/OwnedLabBuild.Tests.ps1 -Mode ToolchainContract
          ./tests/scripts/OwnedLabProbeStaging.Tests.ps1
          ./tests/scripts/OwnedLabProbeOutput.Tests.ps1
      - name: Debug launch privacy and argument regressions
        shell: pwsh
        run: ./tests/scripts/NativeDebugSupport.Tests.ps1
      - name: Publish native host and independent plugins
        id: publish_host
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Core runtime and Windows filesystem tests
        run: dotnet test ProjectWorkbench.Core.slnx -c Release --nologo --logger "trx;LogFileName=core-windows.trx" --results-directory artifacts/tests
      - name: Audited production delivery packaging regressions
        shell: pwsh
        run: |
          ./tests/scripts/DeliveryHostVersion.Tests.ps1
          ./tests/scripts/BusinessPluginDelivery.Tests.ps1 -AppDirectory ./artifacts/native/app
      - name: Independent testing package integrity and actual package-store install
        id: testing_package
        if: ${{ always() && steps.publish_host.outcome == 'success' }}
        shell: pwsh
        run: |
          ./tests/scripts/TestingPluginPackage.Tests.ps1 -Directory ./artifacts/native/testing-plugin -RequireCurrentSource
          dotnet run --project ./tests/Workbench.Testing.PackageProbe/Workbench.Testing.PackageProbe.csproj -c Release -- ./artifacts/native/testing-plugin/workbench-testing-plugin-0.2.0.zip
          if ($LASTEXITCODE -ne 0) { throw 'Actual testing package-store acceptance failed.' }
      - name: Export and verify production plugins paired with current host
        id: business_export
        if: ${{ always() && steps.publish_host.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/export-business-plugins.ps1 -RequireCurrentSource
          Import-Module ./scripts/BusinessPluginDelivery.psm1 -Force
          Test-BusinessPluginDelivery -Directory ./artifacts/native/business-plugins -AppDirectory ./artifacts/native/app -RequireCurrentSource
      - name: Real WinUI isolated native smoke
        id: native_smoke
        if: ${{ always() && steps.publish_host.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/native-smoke.ps1 -TimeoutSeconds 120
      - name: Native runtime management and actual process restarts
        if: ${{ always() && steps.publish_host.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/native-runtime-probe.ps1 -TimeoutSeconds 180
      - name: Native project workspaces and actual process restore
        if: ${{ always() && steps.publish_host.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/project-workspace-probe.ps1 -TimeoutSeconds 180
      - name: Independent testing plugin actual native pass failure cancel and process restore
        if: ${{ always() && steps.publish_host.outcome == 'success' && steps.testing_package.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/testing-plugin-probe.ps1 -TimeoutSeconds 240
      - name: Independent DingTalk and UPCAM in current shipping app
        if: ${{ always() && steps.publish_host.outcome == 'success' && steps.business_export.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/business-plugin-smoke.ps1 -TimeoutSeconds 300 -ProductionInputRoot ./artifacts/native/business-plugins
      - name: Collect strict genuine WinUI gallery
        id: gallery_collect
        if: always()
        shell: pwsh
        run: ./scripts/collect-native-gallery.ps1
      - name: Actual owned Windows UIA capture identity and failure retirement
        if: ${{ always() && steps.publish_host.outcome == 'success' && steps.testing_package.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/owned-lab-probe.ps1 -DeliveryDirectory ./artifacts/native/testing-plugin
      - name: Export independent SDK source and NuGet snapshot
        shell: pwsh
        run: ./scripts/export-sdk.ps1
      - name: Verify SDK snapshot integrity and identity
        shell: pwsh
        run: ./tests/scripts/SdkSnapshot.Tests.ps1 -SnapshotRoot ./artifacts/sdk-snapshot
      - name: Reverify independently installable testing delivery
        shell: pwsh
        run: |
          Import-Module ./scripts/TestingPluginDelivery.psm1 -Force
          Test-TestingPluginDelivery -Directory ./artifacts/native/testing-plugin -RequireCurrentSource
      - name: Reverify the tested production download before upload
        shell: pwsh
        run: |
          Import-Module ./scripts/BusinessPluginDelivery.psm1 -Force
          Test-BusinessPluginDelivery -Directory ./artifacts/native/business-plugins -AppDirectory ./artifacts/native/app -RequireCurrentSource
      - name: Collect native exception text after smoke failure
        id: native_debug
        if: failure() && steps.native_smoke.outcome == 'failure'
        shell: pwsh
        run: ./scripts/native-debug.ps1 -TimeoutSeconds 240
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-verification-evidence
          path: |
            artifacts/native/native-smoke.json
            artifacts/native/native-smoke.gallery-binding.json
            artifacts/native/native-stdout.log
            artifacts/native/native-stderr.log
            artifacts/native/native-crash-events.json
            artifacts/native/gallery/
            artifacts/native/runtime-probes/
            artifacts/native/workspace-probes/
            artifacts/native/testing-probes/
            artifacts/native/business-probes/
            artifacts/native/owned-lab-probes/
            artifacts/native/native-debug/
            artifacts/tests/
            src/Workbench.App/obj/**/App.g*.cs
            src/Workbench.App/obj/**/XamlTypeInfo.g.cs
          if-no-files-found: warn
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && hashFiles('artifacts/native/genuine-gallery/index.json') != '' }}
        with:
          name: workbench-ui-gallery
          path: artifacts/native/genuine-gallery/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: workbench-testing-plugin-0.2.0
          path: artifacts/native/testing-plugin/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: workbench-sdk-0.4.0
          path: artifacts/sdk-snapshot.zip
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: workbench-business-plugins
          path: artifacts/native/business-plugins/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: workbench-win-x64
          path: artifacts/native/app/
          if-no-files-found: error
          retention-days: 1
